{% extends "base.html" %}

{% block title %}
  404 - Страница не найдена
{% endblock %}

{% block content %}
  <section class="container my-5 px-4 text-center">
    <h1>
      <span style="color:red">404</span>
    </h1>

    <h3>
      Страница не найдена
    </h3>

    <p class="my-4">
      Такой страницы не существует.
    </p>

    <a
      href="{{ url_for('index_view') }}"
      class="btn btn-primary"
    >
      На главную
    </a>
  </section>
{% endblock %}
